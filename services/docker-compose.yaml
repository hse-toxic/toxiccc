version: "3.4"

services:
  server:
    build:
      dockerfile: Dockerfile
      context: ./server
    ports: 
      - "8080:8000"
    container_name: server
    networks:
      toxic_network:
      default:

  bot:
    build:
      dockerfile: Dockerfile
      context: ./bot
    container_name: bot
    environment:
      SERVER_ADDRESS: 'server:8080'
      TOKEN: ${BOT_TOKEN}
    networks:
      toxic_network:
      default:
    depends_on:
      - server
    profiles:
    - tg

networks:
  default:
    driver: bridge
  toxic_network:
    driver: bridge
    internal: true