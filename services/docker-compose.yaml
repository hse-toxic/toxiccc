version: "3.4"

services:
  server:
    build:
      dockerfile: Dockerfile
      context: ./server
    # image: server:v1.0.0
    #
    ports: 
      - "8080:8000"
    container_name: server
    # network_mode: host
    networks:
      toxic_network:
      default:

  bot:
    build:
      dockerfile: Dockerfile
      context: ./bot
    # image: bot:v1.0.0
    container_name: bot
    environment:
      SERVER_ADDRESS: 'server:8080'
      TOKEN: ${BOT_TOKEN}
    # network_mode: host
    networks:
      toxic_network:
      default:
    depends_on:
      - server

networks:
  default:
    driver: bridge
  toxic_network:
    driver: bridge
    internal: true